# Default values for kubeseal-ui.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# API server (Go backend).
api:
  replicaCount: 1
  autoscaling:
    enabled: false
  image:
    repository: ghcr.io/kubeseal-ui/api
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    capabilities:
      drop:
        - ALL
  env:
    OIDC_ISSUER: ""
    OIDC_CLIENT_ID: ""
    LOG_LEVEL: info
  enableDecrypt: false
  controllerNamespace: cluster
  activeKeyLabel: sealedsecrets.bitnami.com/sealed-secrets-key
  probes:
    liveness:
      path: /healthz
    readiness:
      path: /readyz

  # GitOps delivery (phase 4): go-git transport with typed credentials.
  # Disabled boots keep the delivery endpoints fail-closed.
  gitops:
    enabled: false
    authorName: kubeseal-ui
    authorEmail: ""
    worktreeDir: /tmp/kubeseal-ui/gitops
    # Typed, file-backed credentials. Each entry needs:
    #   authRef    - the policy mapping's auth reference
    #   mode       - https-token | ssh-agent | none
    #   username   - Basic username (https-token); optional
    #   tokenFile  - path to the Secret-mounted token; required for https-token
    # The token file is read per call, so rotating the Secret takes
    # effect without a restart. Tokens never live in values.yaml.
    credentials: []
    # - authRef: platform-repo
    #   mode: https-token
    #   username: kubeseal-ui
    #   tokenFile: /var/run/secrets/git/platform/token
    # Namespaced Git policies: one entry per namespace. Clients never
    # choose repository, branch, path, or mode — these are the only
    # server-side sources.
    namespaces: []
    # - namespace: payments
    #   repository: org/platform-repo
    #   branch: main
    #   pathTemplate: clusters/{namespace}/{name}.yaml
    #   authRef: platform-repo
    #   mode: direct            # direct | proposal
    #   # proposalAdapter: github-pr   # required when mode is proposal
    credentialSecretName: ""
    # Optional proposal adapters. A proposal namespace may only reference a
    # name declared here; the render fails otherwise. Each entry needs:
    #   name      - the name a namespace mapping references
    #   type      - github (GitHub REST pull requests); more types may land
    #   tokenFile - path to the Secret-mounted PAT; required
    #   baseUrl   - optional API root override (GitHub Enterprise Server)
    # The token file is read per call, so a rotated Secret takes effect
    # without a restart. Tokens never live in values.yaml.
    proposalAdapters: []
    # - name: github-pr
    #   type: github
    #   tokenFile: /var/run/secrets/git/proposal/token
    #   # baseUrl: https://github.example.com/api/v3
    # Secret holding the proposal adapter tokens. Falls back to
    # credentialSecretName when empty. Ignored when no adapter is declared.
    proposalCredentialSecretName: ""

# UI server (Vue 3 frontend served by nginx).
ui:
  replicaCount: 1
  autoscaling:
    enabled: false
  image:
    repository: ghcr.io/kubeseal-ui/frontend
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    capabilities:
      drop:
        - ALL

# NetworkPolicy for the API and UI pods (templates/networkpolicy.yaml).
# Disabled by default: the egress destinations depend on the cluster.
networkPolicy:
  enabled: false
  # Namespace running cluster DNS. Egress to it on 53 is always allowed.
  dnsNamespace: kube-system
  api:
    # Ingress sources for the API port. Empty renders a rule with no
    # sources, which allows every pod; set this to restrict traffic.
    ingress: []
    # - namespaceSelector:
    #     matchLabels:
    #       kubernetes.io/metadata.name: ingress-nginx
  ui:
    # Same contract as api.ingress, for the UI port.
    ingress: []
  egress:
    # Required when the policy is enabled: the Kubernetes API, the OIDC
    # issuer, the Git remotes, and the proposal APIs are environment
    # specific, so the chart refuses to guess them.
    cidrs: []
    # - 10.43.0.1/32          # in-cluster API service
    # - 203.0.113.10/32       # OIDC issuer
    namespaceSelectors: []
    # - matchLabels:
    #     kubernetes.io/metadata.name: git-system

worktree:
  emptyDir:
    sizeLimit: 1Gi
