apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeseal-ui.uiName" . }}
  labels:
{{ include "kubeseal-ui.labels" . | nindent 4 }}
spec:
{{- if not .Values.ui.autoscaling.enabled }}
  replicas: {{ .Values.ui.replicaCount }}
{{- end }}
  selector:
    matchLabels:
{{ include "kubeseal-ui.ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
{{ include "kubeseal-ui.ui.selectorLabels" . | nindent 8 }}
    spec:
{{- with .Values.ui.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | nindent 8 }}
{{- end }}
      securityContext:
{{ toYaml .Values.ui.podSecurityContext | nindent 8 }}
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ default .Chart.AppVersion (default "" .Values.ui.image.tag) }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          securityContext:
{{ toYaml .Values.ui.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
{{ toYaml .Values.ui.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
