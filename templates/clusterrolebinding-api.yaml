apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeseal-ui.apiName" . }}
  labels:
{{ include "kubeseal-ui.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeseal-ui.apiName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeseal-ui.apiName" . }}
    namespace: {{ .Release.Namespace }}
