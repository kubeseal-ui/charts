apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubeseal-ui.fullname" . }}
  labels:
    {{- include "kubeseal-ui.labels" (dict "ctx" . "component" "ui") | nindent 4 }}
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      protocol: TCP
      targetPort: http
  selector:
    {{- include "kubeseal-ui.selectorLabels" (dict "ctx" . "component" "ui") | nindent 4 }}
