apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubeseal-ui.apiName" . }}
  labels:
{{ include "kubeseal-ui.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
{{ include "kubeseal-ui.api.selectorLabels" . | nindent 4 }}
