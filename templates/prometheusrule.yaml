{{- if .Values.observability.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kubeseal-ui.api.fullname" . }}
  labels:
    {{- include "kubeseal-ui.labels" (dict "ctx" . "component" "api") | nindent 4 }}
    {{- with .Values.observability.prometheusRule.selector }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.observability.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kubeseal-ui
      rules:
        - alert: KubesealUIHighErrorRate
          expr: |
            sum(rate(kubeseal_ui_http_requests_total{code=~"5.."}[5m]))
              /
            sum(rate(kubeseal_ui_http_requests_total[5m])) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: kubeseal-ui is returning 5xx responses
            description: 5xx responses have exceeded 5% of requests for 10 minutes.
        - alert: KubesealUIHighLatency
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(kubeseal_ui_http_request_duration_seconds_bucket[5m]))) > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: kubeseal-ui p99 latency is above 2s
            description: The 99th percentile request duration has exceeded 2 seconds for 10 minutes.
        - alert: KubesealUIGitOpsPushFailing
          expr: |
            sum(increase(kubeseal_ui_gitops_delivery_total{result=~"failed|conflict|proposal_failed"}[30m])) > 3
          labels:
            severity: warning
          annotations:
            summary: kubeseal-ui GitOps deliveries are failing
            description: More than 3 delivery attempts failed, conflicted, or failed to open a proposal in 30 minutes.
        - alert: KubesealUICryptoFailures
          expr: |
            sum(increase(kubeseal_ui_sealed_secret_operations_total{result="failed"}[15m])) > 5
          labels:
            severity: warning
          annotations:
            summary: kubeseal-ui sealing or reveal operations are failing
            description: More than 5 sealed-secret operations reached result="failed" in 15 minutes.
{{- end }}
