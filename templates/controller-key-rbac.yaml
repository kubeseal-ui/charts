{{- if .Values.api.enableDecrypt }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubeseal-ui.apiName" . }}-controller-key
  namespace: {{ .Values.api.controllerNamespace | required "api.controllerNamespace is required when api.enableDecrypt is true" }}
  labels:
{{ include "kubeseal-ui.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubeseal-ui.apiName" . }}-controller-key
  namespace: {{ .Values.api.controllerNamespace }}
  labels:
{{ include "kubeseal-ui.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubeseal-ui.apiName" . }}-controller-key
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeseal-ui.apiName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
