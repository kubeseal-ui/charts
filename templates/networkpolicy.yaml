{{- if .Values.networkPolicy.enabled }}
{{- if and (not .Values.networkPolicy.egress.cidrs) (not .Values.networkPolicy.egress.namespaceSelectors) }}
{{- fail "networkPolicy.enabled requires networkPolicy.egress.cidrs or networkPolicy.egress.namespaceSelectors" }}
{{- end }}
{{- /*
The api reaches the Kubernetes API, the OIDC issuer, Git remotes, proposal
APIs, and the certificate provider. Those destinations are environment
specific, so the chart renders what is declared and refuses to guess.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubeseal-ui.api.fullname" . }}
  labels:
    {{- include "kubeseal-ui.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubeseal-ui.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- with .Values.networkPolicy.api.ingress }}
    - from:
        {{- toYaml . | nindent 8 }}
    {{- else }}
    - {}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        {{- range .Values.networkPolicy.egress.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        {{- range .Values.networkPolicy.egress.namespaceSelectors }}
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
    {{- if and .Values.observability.otlpEndpoint .Values.networkPolicy.egress.otlp }}
    - to:
        {{- range .Values.networkPolicy.egress.otlp }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 4317
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubeseal-ui.fullname" . }}
  labels:
    {{- include "kubeseal-ui.labels" (dict "ctx" . "component" "ui") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubeseal-ui.selectorLabels" (dict "ctx" . "component" "ui") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- with .Values.networkPolicy.ui.ingress }}
    - from:
        {{- toYaml . | nindent 8 }}
    {{- else }}
    - {}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- /*
    The UI image proxies /api to the API Service in its own namespace, so
    that one destination is derived rather than operator-supplied.
    */}}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "kubeseal-ui.selectorLabels" (dict "ctx" . "component" "api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.service.port }}
{{- end }}
