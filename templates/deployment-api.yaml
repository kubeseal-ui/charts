{{- include "kubeseal-ui.gitops.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeseal-ui.apiName" . }}
  labels:
{{ include "kubeseal-ui.labels" . | nindent 4 }}
spec:
{{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
{{- end }}
  selector:
    matchLabels:
{{ include "kubeseal-ui.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
{{ include "kubeseal-ui.api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kubeseal-ui.apiName" . }}
{{- with .Values.api.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | nindent 8 }}
{{- end }}
      securityContext:
{{ toYaml .Values.api.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ default .Chart.AppVersion (default "" .Values.api.image.tag) }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
{{ toYaml .Values.api.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: KUBESEAL_API_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: {{ .Values.api.env.LOG_LEVEL | quote }}
            - name: OIDC_ISSUER
              value: {{ .Values.api.env.OIDC_ISSUER | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.api.env.OIDC_CLIENT_ID | quote }}
            - name: ENABLE_DECRYPT
              value: {{ .Values.api.enableDecrypt | quote }}
            - name: KUBESEAL_CONTROLLER_NAMESPACE
              value: {{ .Values.api.controllerNamespace | quote }}
            - name: KUBESEAL_ACTIVE_KEY_LABEL
              value: {{ .Values.api.activeKeyLabel | quote }}
            - name: GITOPS_ENABLED
              value: {{ .Values.api.gitops.enabled | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ trimPrefix "http://" .Values.observability.otlpEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ include "kubeseal-ui.apiName" . | quote }}
            - name: OTEL_SERVICE_VERSION
              value: {{ default .Chart.AppVersion (default "" .Values.api.image.tag) | quote }}
            - name: OTEL_DEPLOYMENT_ENVIRONMENT
              value: {{ .Release.Namespace | quote }}
            {{- if .Values.observability.traceSampleRatio }}
            - name: OTEL_TRACE_SAMPLE_RATIO
              value: {{ .Values.observability.traceSampleRatio | quote }}
            {{- end }}
            {{- if .Values.observability.metricIntervalSeconds }}
            - name: OTEL_METRIC_INTERVAL_SECONDS
              value: {{ .Values.observability.metricIntervalSeconds | quote }}
            {{- end }}
            - name: GITOPS_AUTHOR_NAME
              value: {{ .Values.api.gitops.authorName | quote }}
            - name: GITOPS_AUTHOR_EMAIL
              value: {{ .Values.api.gitops.authorEmail | quote }}
            - name: GITOPS_WORKTREE_DIR
              value: {{ .Values.api.gitops.worktreeDir | quote }}
            - name: GITOPS_CREDENTIAL_REFS
              value: {{ include "kubeseal-ui.gitopsCredentialRefs" . | quote }}
            {{- if .Values.api.gitops.enabled }}
            - name: GITOPS_NAMESPACES
              value: {{ include "kubeseal-ui.gitopsNamespaceSpecs" . | quote }}
            {{- if .Values.api.gitops.proposalAdapters }}
            - name: GITOPS_PROPOSAL_ADAPTERS
              value: {{ include "kubeseal-ui.gitopsProposalAdapters" . | quote }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.liveness.path }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.readiness.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
{{ toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: worktree
              mountPath: /tmp/kubeseal-ui
            {{- if .Values.api.gitops.enabled }}
            {{- range .Values.api.gitops.credentials }}
            {{- if .tokenFile }}
            - name: git-credentials
              mountPath: {{ dir .tokenFile }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- range .Values.api.gitops.proposalAdapters }}
            {{- if .tokenFile }}
            - name: git-proposal-credentials
              mountPath: {{ dir .tokenFile }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- end }}
      volumes:
        - name: worktree
          emptyDir:
            sizeLimit: {{ .Values.worktree.emptyDir.sizeLimit }}
        {{- if and .Values.api.gitops.enabled .Values.api.gitops.credentialSecretName }}
        - name: git-credentials
          secret:
            secretName: {{ .Values.api.gitops.credentialSecretName }}
        {{- end }}
        {{- if and .Values.api.gitops.enabled .Values.api.gitops.proposalAdapters }}
        - name: git-proposal-credentials
          secret:
            secretName: {{ include "kubeseal-ui.gitopsProposalSecretName" . }}
        {{- end }}
      terminationGracePeriodSeconds: 30
