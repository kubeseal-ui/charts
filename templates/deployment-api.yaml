{{- include "kubeseal-ui.validate" . }}
{{- $g := .Values.api.gitops }}
{{- $env := dict }}
{{- range $key, $value := .Values.api.env }}
{{- $_ := set $env $key (toString $value) }}
{{- end }}
{{- $_ := set $env "KUBESEAL_API_PORT" (toString .Values.api.service.port) }}
{{- $_ := set $env "ENABLE_DECRYPT" (toString .Values.api.enableDecrypt) }}
{{- $_ := set $env "LOG_LEVEL" .Values.api.logLevel }}
{{- $_ := set $env "KUBESEAL_API_TIMEOUT_SECONDS" (toString .Values.api.apiTimeoutSeconds) }}
{{- $_ := set $env "KUBESEAL_CONTROLLER_NAMESPACE" .Values.api.controllerNamespace }}
{{- $_ := set $env "KUBESEAL_ACTIVE_KEY_LABEL" .Values.api.controllerKeyLabel }}
{{- if .Values.api.certURL }}
{{- $_ := set $env "KUBESEAL_CERT_URL" .Values.api.certURL }}
{{- end }}
{{- if .Values.api.policy.existingConfigMap }}
{{- $_ := set $env "CONFIG_PATH" (printf "%s/%s" .Values.api.policy.mountPath .Values.api.policy.fileName) }}
{{- end }}
{{- if $g.enabled }}
{{- $_ := set $env "GITOPS_ENABLED" "true" }}
{{- $_ := set $env "GITOPS_AUTHOR_NAME" $g.authorName }}
{{- if $g.authorEmail }}
{{- $_ := set $env "GITOPS_AUTHOR_EMAIL" $g.authorEmail }}
{{- end }}
{{- $_ := set $env "GITOPS_WORKTREE_DIR" $g.worktreeDir }}
{{- $_ := set $env "GITOPS_CREDENTIAL_REFS" (include "kubeseal-ui.gitopsCredentialRefs" .) }}
{{- $_ := set $env "GITOPS_NAMESPACES" (include "kubeseal-ui.gitopsNamespaceSpecs" .) }}
{{- if $g.proposalAdapters }}
{{- $_ := set $env "GITOPS_PROPOSAL_ADAPTERS" (include "kubeseal-ui.gitopsProposalAdapters" .) }}
{{- end }}
{{- end }}
{{- if .Values.observability.otlpEndpoint }}
{{- $_ := set $env "OTEL_EXPORTER_OTLP_ENDPOINT" (regexReplaceAll "^https?://" .Values.observability.otlpEndpoint "") }}
{{- $_ := set $env "OTEL_SERVICE_NAME" (include "kubeseal-ui.api.fullname" .) }}
{{- $_ := set $env "OTEL_SERVICE_VERSION" (default .Chart.AppVersion .Values.api.image.tag) }}
{{- $_ := set $env "OTEL_DEPLOYMENT_ENVIRONMENT" .Release.Namespace }}
{{- end }}
{{- if .Values.observability.traceSampleRatio }}
{{- $_ := set $env "OTEL_TRACE_SAMPLE_RATIO" (toString .Values.observability.traceSampleRatio) }}
{{- end }}
{{- if .Values.observability.metricIntervalSeconds }}
{{- $_ := set $env "OTEL_METRIC_INTERVAL_SECONDS" (toString .Values.observability.metricIntervalSeconds) }}
{{- end }}
{{- /* Each token file's directory is mounted from the Secret that holds it. */}}
{{- $secretMounts := dict }}
{{- range $g.credentials }}
{{- if .tokenFile }}
{{- $_ := set $secretMounts (dir .tokenFile) $.Values.api.gitops.credentialSecretName }}
{{- end }}
{{- end }}
{{- $proposalSecret := default $g.credentialSecretName $g.proposalCredentialSecretName }}
{{- range $g.proposalAdapters }}
{{- if .tokenFile }}
{{- $d := dir .tokenFile }}
{{- if and (hasKey $secretMounts $d) (ne (get $secretMounts $d) $proposalSecret) }}
{{- fail (printf "token directory %q would be mounted from two different Secrets" $d) }}
{{- end }}
{{- $_ := set $secretMounts $d $proposalSecret }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeseal-ui.api.fullname" . }}
  labels:
    {{- include "kubeseal-ui.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubeseal-ui.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubeseal-ui.selectorLabels" (dict "ctx" . "component" "api") | nindent 8 }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kubeseal-ui.api.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "kubeseal-ui.image" (dict "root" . "image" .Values.api.image) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          env:
            {{- range $key := keys $env | sortAlpha }}
            - name: {{ $key }}
              value: {{ get $env $key | quote }}
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.api.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: worktree
              mountPath: {{ .Values.api.worktree.mountPath }}
            {{- if .Values.api.policy.existingConfigMap }}
            - name: authz
              mountPath: {{ .Values.api.policy.mountPath }}
              readOnly: true
            {{- end }}
            {{- range $path, $secret := $secretMounts }}
            - name: git-{{ $path | sha256sum | trunc 8 }}
              mountPath: {{ $path }}
              readOnly: true
            {{- end }}
            {{- with .Values.api.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: worktree
          emptyDir:
            {{- with .Values.api.worktree.emptyDir.sizeLimit }}
            sizeLimit: {{ . }}
            {{- else }}
            {}
            {{- end }}
        {{- if .Values.api.policy.existingConfigMap }}
        - name: authz
          configMap:
            name: {{ .Values.api.policy.existingConfigMap }}
        {{- end }}
        {{- range $path, $secret := $secretMounts }}
        - name: git-{{ $path | sha256sum | trunc 8 }}
          secret:
            secretName: {{ $secret }}
        {{- end }}
        {{- with .Values.api.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
