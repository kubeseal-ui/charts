name: Install or values support
description: Ask for help installing the chart or configuring GitOps, decrypt, ingress, or NetworkPolicy values
title: "[support] "
labels: ["support", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        See `kubeseal-ui/api` `docs/troubleshooting.md` first. **Never attach plaintext, ciphertext, tokens, cookies, controller keys, or credential-bearing URLs.**
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: chart 0.2.0, api 0.5.0-dev, ui 0.3.0, k8s 1.31, sealed-secrets 0.39.1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Install or upgrade
        - GitOps values and mappings
        - Proposal adapter values
        - Decrypt and controller-key RBAC
        - Ingress
        - NetworkPolicy
        - Observability
    validations:
      required: true
  - type: textarea
    id: values
    attributes:
      label: Sanitized values excerpt
      render: yaml
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Include the exact commands and their output with sensitive values removed.
    validations:
      required: false
  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction confirmation
      options:
        - label: I have removed plaintext, ciphertext, controller keys, tokens, cookies, and credential-bearing URLs from this report.
          required: true
