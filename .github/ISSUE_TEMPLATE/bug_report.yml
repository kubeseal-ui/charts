name: Chart bug report
description: Report a defect in the kubeseal-ui Helm chart
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach plaintext, ciphertext, controller private keys, tokens, cookies, or credential-bearing URLs.**
        API-level defects belong in `kubeseal-ui/api`; see its issue templates.
  - type: input
    id: chart-version
    attributes:
      label: Chart version and app version
      placeholder: chart 0.2.0, appVersion 0.5.0-dev
    validations:
      required: true
  - type: input
    id: k8s-version
    attributes:
      label: Kubernetes and Sealed Secrets versions
      placeholder: k8s v1.31.2, sealed-secrets v0.39.1
    validations:
      required: true
  - type: dropdown
    id: install-path
    attributes:
      label: Install path
      options:
        - helm install / helm upgrade
        - ArgoCD
        - other GitOps controller
        - other
    validations:
      required: true
  - type: textarea
    id: values
    attributes:
      label: Sanitized values excerpt
      description: The values that matter, with Secret names, tokens, hosts, and paths sanitized.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands and output
      description: The exact helm or kubectl commands and their output, with sensitive values removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction confirmation
      options:
        - label: I have removed plaintext, ciphertext, controller keys, tokens, cookies, and credential-bearing URLs from this report.
          required: true
