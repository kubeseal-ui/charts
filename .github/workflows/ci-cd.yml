name: CI/CD Pipeline

# Standardized to match the pamawas-infra lint-helm job shape (per the
# ci-cd-advanced-patterns skill). The kubeseal-ui/charts repo only owns
# a Helm chart, so docker / build / test jobs are intentionally absent
# (charts do not produce images or run unit tests).
#
# Job shape:
#   lint-helm  -> helm lint + helm template + kubeconform + validate.sh
#   security   -> trivy fs scan + sarif upload (mirrors pamawas 5-job shape)
#   release    -> tag-only, uses chart-releaser to publish the chart to
#                 GH Pages with an index.yaml Helm repo

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-helm:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Helm
      run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

    - name: Install kubeconform
      run: |
        wget -q https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
        tar -xzf kubeconform-linux-amd64.tar.gz
        sudo mv kubeconform /usr/local/bin/

    - name: Lint Helm chart
      run: |
        helm lint .
        echo "Helm chart is valid"

    - name: Template Helm chart (dry-run)
      run: |
        helm template test-release . --dry-run --debug > /dev/null
        echo "Helm template renders successfully"

    - name: Validate rendered chart contracts
      run: scripts/validate.sh

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  release:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure Git
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

    - name: Install Helm
      run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

    - name: Run chart-releaser
      uses: helm/chart-releaser-action@v1.6.0
      with:
        charts_dir: .
      env:
        CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
